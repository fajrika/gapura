services:
  db:
    image: postgres:18-alpine
    container_name: gapura-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gapura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gapura_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gapura}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gapura} -d ${POSTGRES_DB:-gapura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: gapura-app:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gapura}:${POSTGRES_PASSWORD:-gapura_secret}@db:5432/${POSTGRES_DB:-gapura}
    command: ["node", "migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
        NEXT_PUBLIC_VAPID_KEY: ${NEXT_PUBLIC_VAPID_KEY:-}
    image: gapura-app:latest
    container_name: gapura-app
    restart: unless-stopped
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gapura}:${POSTGRES_PASSWORD:-gapura_secret}@db:5432/${POSTGRES_DB:-gapura}
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-secret-acak}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
      NEXT_PUBLIC_VAPID_KEY: ${NEXT_PUBLIC_VAPID_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: gapura-go2rtc
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - go2rtc-data:/config

volumes:
  pgdata:
  go2rtc-data:
